name: ci
on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          cache-dependency-glob: "**/requirements*.txt"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install ruff pytest pytest-xdist
          [ -f requirements.txt ] && uv pip install -r requirements.txt || true
          [ -f requirements-dev.txt ] && uv pip install -r requirements-dev.txt || true
          [ -f requirements-test.txt ] && uv pip install -r requirements-test.txt || true
          if [ -f pyproject.toml ] && grep -qE '^\[(project|build-system)\]' pyproject.toml; then
            uv pip install -e '.[dev]' 2>/dev/null \
              || uv pip install -e '.[test]' 2>/dev/null \
              || uv pip install -e . || true
          fi

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
